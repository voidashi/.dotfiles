# catnap, themed for Voidashi. https://github.com/iinsertNameHere/catnap
#
# Same mapping as the fastfetch configs, so switching the fish greeter between
# them does not change what a colour means. Each family appears only on the rows
# it stands for:
#
#   (RD) bordeaux-400  identity   username, hostname, and the logo in distros.toml
#   (GN) moss-400      duration   uptime
#   (BE) ice-400       function   distro, kernel, desktop, terminal, shell, cpu, gpu
#   (WH) reset         quantity   packages, memory, disk, battery. A count is not a role.
#
# Not used: (YW) bronze, since rarity of use is part of its meaning; (CN)
# verdigris, which the guide restricts to ANSI slots 6 and 14 and to syntax
# highlighting, and which the cachy logo was using; (BK), which is ANSI black,
# meaning void-20, and is unreadable on a void-00 background.
#
# Two constraints worth knowing before editing this file.
#
# catnap 1.x has no hex. Writing "#b44955" here prints the literal string into the
# output; measured. The vocabulary is exactly seven tokens, and anything it does
# not recognise silently becomes a reset:
#
#   (RD)->31  (YW)->33  (BE)->34  (GN)->32  (MA)->35  (CN)->36  (BK)->30
#
# Since those are ANSI slots and our ANSI table is the palette, catnap is on
# palette by construction and cannot drift. What it cannot do is reach a specific
# level: there is no ink-4, which is why keys here are ink-2 rather than the ink-4
# the fastfetch configs use.
#
# catnap 2.0 deleted this config format. Upstream is at 2.1.1 and replaced TOML
# entirely with a ".cat" language; its own docs say config.toml and distros.toml
# are not compatible with v2. The AUR package is still 1.1.1, so this works today
# and will break outright the day it moves. v2 accepts hex, RGB and theme imports,
# so the upgrade is worth wanting, but it is a rewrite of both files rather than an
# edit. See docs/TODO.md.
#
# Other appearance options this file uses, for reference: [misc].borderstyle takes
# line, dotted or dashed; [misc].layout takes Inline, ArtOnTop or StatsOnTop;
# [misc.figletLogos] needs figlet and [misc.imageMode] needs viu, both off here.
##############################################
##          FetchInfo stats Config          ##
##############################################
[stats]
username  = {icon = " ", name = "user", color = "(RD)"}
hostname  = {icon = " ", name = "hostname", color = "(RD)"}
uptime    = {icon = " ", name = "uptime", color = "(GN)"}
distro    = {icon = " ", name = "distro", color = "(BE)"}
kernel    = {icon = " ", name = "kernel", color = "(BE)"}
desktop   = {icon = " ", name = "desktop", color = "(BE)"}
terminal  = {icon = " ", name = "term", color = "(BE)"}
shell     = {icon = " ", name = "shell", color = "(BE)"}
# packages  = {icon = " ", name = "packages", color = "(WH)"}  # WARNING: Resource Intensive
# weather   = {icon = " ", name = "weather", color = "(WH)"} # Requires curl and an emoji font. | WARNING: Resource Intensive
# The following stats do not work on MacOS and the BSDs.
# gpu       = {icon = "󱔐 ", name = "gpu", color = "(BE)"}      # WARNING: Resource Intensive
# cpu       = {icon = " ", name = "cpu", color = "(BE)"}
# disk_0    = {icon = " ", name = "disk", color = "(WH)"}
# memory    = {icon = " ", name = "memory", color = "(WH)"}
# battery    = {icon = " ", name = "battery", color = "(WH)"}
sep_color = "SEPARATOR"
colors    = {icon = " ", name = "colors", color = "!DT!", symbol = ""}

##############################################
##               Misc Config                ##
##############################################
[misc]
borderstyle = "line"
layout = "Inline" # [Inline, ArtOnTop, StatsOnTop]
stats_margin_top = 0

[misc.figletLogos] # Requires Figlet.
enable = false
color  = "(YW)"
font   = "slant"
margin = [0, 0, 0,]

[misc.imageMode] # Requires Viu.
enable = false
path   = "/path/to/some/image.png" # Please only use absolute paths.
scale  = 18
margin = [2, 2, 3,]

