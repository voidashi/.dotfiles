# GENERATED by scripts/theme/generate_theme.py from scripts/theme/palette.json
# Do not hand-edit: edit palette.json and rerun the generator.
# Voidashi color scheme. See docs/design/RICE-GUIDE.md

[mgr]
cwd = { fg = "#6aa3c7" }

# A mark, not a fill: the selection here is a different thing from the cursor.
marker_copied   = { fg = "#57a26d", bg = "#57a26d" }
marker_cut      = { fg = "#e14b39", bg = "#e14b39" }
marker_marked   = { fg = "#459192", bg = "#459192" }
marker_selected = { fg = "#c76870", bg = "#c76870" }

count_copied   = { fg = "#0a0908", bg = "#57a26d" }
count_cut      = { fg = "#0a0908", bg = "#e14b39" }
count_selected = { fg = "#0a0908", bg = "#c76870" }

border_style = { fg = "#393835" }

find_keyword  = { fg = "#d89529", bold = true }
find_position = { fg = "#9270a7", bold = true }

[tabs]
active   = { fg = "#e8e8e8", bg = "#215b7c" }
inactive = { fg = "#929292", bg = "#191817" }

# The mode badge, in two halves. `_main` is the filled badge and `_alt` is what
# the separator either side of it is drawn in, which is why yazi's own default
# writes the main's colour as the alt's foreground. One filled surface, and the
# alt reads as the seam with the status bar.
[mode]
normal_main = { fg = "#0a0908", bg = "#c76870", bold = true }
normal_alt  = { fg = "#c76870", bg = "#191817" }
select_main = { fg = "#0a0908", bg = "#498bb2", bold = true }
select_alt  = { fg = "#498bb2", bg = "#191817" }
unset_main  = { fg = "#0a0908", bg = "#a57636", bold = true }
unset_alt   = { fg = "#a57636", bg = "#191817" }

# The hovered row is the cursor, and it is the selection role, so it moves with
# GTK's and Qt's rather than on its own.
[indicator]
current = { fg = "#e8e8e8", bg = "#215b7c" }
preview = { underline = true }

[status]
overall         = { fg = "#b1b1b1" }
progress_label  = { fg = "#e8e8e8", bold = true }
progress_normal = { fg = "#498bb2", bg = "#191817" }
progress_error  = { fg = "#e14b39", bg = "#191817" }

[pick]
border   = { fg = "#498bb2" }
active   = { fg = "#c76870", bold = true }
inactive = { fg = "#b1b1b1" }

[input]
border   = { fg = "#498bb2" }
title    = {}
value    = {}
selected = { reversed = true }

[confirm]
border = { fg = "#498bb2" }
title  = { fg = "#498bb2" }
body   = {}
list   = {}
btn_yes = { reversed = true }
btn_no  = {}

[cmp]
border   = { fg = "#498bb2" }
active   = { reversed = true }
inactive = {}

[tasks]
border  = { fg = "#498bb2" }
title   = {}
hovered = { fg = "#c76870", underline = true }

[which]
mask            = { bg = "#191817" }
cand            = { fg = "#459192" }
rest            = { fg = "#6c6c6c" }
desc            = { fg = "#c76870" }
separator_style = { fg = "#4d4d4d" }

[help]
on      = { fg = "#459192" }
run     = { fg = "#c76870" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#191817", bg = "#b1b1b1" }

[notify]
title_info  = { fg = "#57a26d" }
title_warn  = { fg = "#d89529" }
title_error = { fg = "#e14b39" }

# Classification, not decoration: one family per kind of thing, rather than a
# different hue per extension. The key is `url` and not `name`, which yazi 26
# renamed; the old spelling fails to parse rather than being ignored.
[filetype]
rules = [
    { mime = "image/*"                    , fg = "#9270a7" },
    { mime = "video/*"                    , fg = "#a57636" },
    { mime = "audio/*"                    , fg = "#a57636" },
    { mime = "application/zip"            , fg = "#e14b39" },
    { mime = "application/gzip"           , fg = "#e14b39" },
    { mime = "application/x-tar"          , fg = "#e14b39" },
    { mime = "application/x-bzip*"        , fg = "#e14b39" },
    { mime = "application/x-7z-compressed", fg = "#e14b39" },
    { mime = "application/x-rar"          , fg = "#e14b39" },
    { mime = "application/pdf"            , fg = "#c76870" },
    { url = "*/"                          , fg = "#498bb2" },
    { url = "*"                           , fg = "#b1b1b1" },
]
