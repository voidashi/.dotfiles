# =====================================================================
#  YAZI -- Voidashi
# =====================================================================
# yazi runs inside the terminal, so it already inherits the emulator's ANSI
# table and background. What it needs from us is its own chrome: the cursor
# line, the mode indicator, the borders and the file-type colours.
#
# Values come from docs/design/RICE-GUIDE.md by way of scripts/theme/palette.json
# and are written by hand rather than generated, since they mix with structural
# config the way swaylock and starship do.
#
# Roles: Ice for the hovered row, since focus is Ice everywhere in this desktop;
# Bordeaux as the identity mark on the mode indicator, matching the prompt and
# the terminal cursor; alert tones only for states that are genuinely states.
#
# Key names are yazi's, and yazi renames them. Six here named a schema it had
# already dropped, so the colours were written and never painted; see the
# [indicator] and [mode] comments below. Diff any new key against the default
# theme.toml embedded in the binary rather than against yazi's online docs:
#
#   strings -n 4 /usr/bin/yazi | sed -n '/^#:schema.*theme\.json/,/^\[icon\]/p'

[mgr]
cwd = { fg = "#6aa3c7" }              # ice-300

# Selection is a different thing from the cursor and reads as a mark, not a fill.
marker_copied   = { fg = "#57a26d", bg = "#57a26d" }   # alert-good
marker_cut      = { fg = "#e14b39", bg = "#e14b39" }   # alert-critical
marker_marked   = { fg = "#459192", bg = "#459192" }   # verdigris-400
marker_selected = { fg = "#c76870", bg = "#c76870" }   # bordeaux-300

count_copied   = { fg = "#0a0908", bg = "#57a26d" }
count_cut      = { fg = "#0a0908", bg = "#e14b39" }
count_selected = { fg = "#0a0908", bg = "#c76870" }

border_symbol = "│"
border_style  = { fg = "#393835" }    # edge-30

find_keyword  = { fg = "#d89529", bold = true }   # alert-caution
find_position = { fg = "#9270a7", bold = true }   # ash-400

[tabs]
active   = { fg = "#e8e8e8", bg = "#215b7c" }
inactive = { fg = "#929292", bg = "#191817" }

# The mode badge. yazi splits each mode into a filled half and a trailing half:
# `_main` is the badge itself and `_alt` is what the separator either side of it
# is drawn in, which is why the default writes the main's colour as the alt's
# foreground. This desktop keeps one filled surface and lets the alt read as the
# seam with the status bar, so alt is the main's tone over void-20.
#
# These were `normal`, `select` and `unset` until yazi split them, and the three
# old spellings were parsed and dropped: the badge came out 48;5;4, yazi's own
# blue, while bordeaux-300 sat in this file being read by nothing.
[mode]
normal_main = { fg = "#0a0908", bg = "#c76870", bold = true }   # bordeaux-300, the identity mark
normal_alt  = { fg = "#c76870", bg = "#191817" }               # bordeaux-300 on void-20
select_main = { fg = "#0a0908", bg = "#498bb2", bold = true }   # ice-400
select_alt  = { fg = "#498bb2", bg = "#191817" }
unset_main  = { fg = "#0a0908", bg = "#a57636", bold = true }   # bronze-400
unset_alt   = { fg = "#a57636", bg = "#191817" }

# The hovered row is the cursor. Ice, filled, the same relationship the bar's
# active workspace has with its rule. This lived under [mgr] as `hovered` and
# `preview_hovered`, which yazi moved here and renamed.
[indicator]
current = { fg = "#e8e8e8", bg = "#215b7c" }   # ink-0 on ice-600
preview = { underline = true }

[status]
overall     = { fg = "#b1b1b1" }
sep_left    = { open = "", close = "" }
sep_right   = { open = "", close = "" }
progress_label  = { fg = "#e8e8e8", bold = true }
progress_normal = { fg = "#498bb2", bg = "#191817" }
progress_error  = { fg = "#e14b39", bg = "#191817" }

[pick]
border   = { fg = "#498bb2" }
active   = { fg = "#c76870", bold = true }
inactive = { fg = "#b1b1b1" }

[input]
border   = { fg = "#498bb2" }
title    = {}
value    = {}
selected = { reversed = true }

[confirm]
border     = { fg = "#498bb2" }
title      = { fg = "#498bb2" }
body       = {}                       # was `content`, which yazi renamed
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  Yes  ", "  (N)o  " ]

[cmp]
border   = { fg = "#498bb2" }
active   = { reversed = true }
inactive = {}

[tasks]
border  = { fg = "#498bb2" }
title   = {}
hovered = { fg = "#c76870", underline = true }

[which]
mask            = { bg = "#191817" }
cand            = { fg = "#459192" }   # verdigris-400
rest            = { fg = "#6c6c6c" }   # ink-4
desc            = { fg = "#c76870" }   # bordeaux-300
separator       = "  "
separator_style = { fg = "#4d4d4d" }   # ink-5

[help]
on      = { fg = "#459192" }
run     = { fg = "#c76870" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#191817", bg = "#b1b1b1" }

[notify]
title_info  = { fg = "#57a26d" }   # alert-good
title_warn  = { fg = "#d89529" }   # alert-caution
title_error = { fg = "#e14b39" }   # alert-critical

# File types. Restrained on purpose: colour here is classification, not
# decoration, so it stays inside the palette's families rather than reaching
# for a different hue per extension.
[filetype]
rules = [
    { mime = "image/*", fg = "#9270a7" },        # ash-400
    { mime = "video/*", fg = "#a57636" },        # bronze-400
    { mime = "audio/*", fg = "#a57636" },
    { mime = "application/zip",     fg = "#e14b39" },
    { mime = "application/gzip",    fg = "#e14b39" },
    { mime = "application/x-tar",   fg = "#e14b39" },
    { mime = "application/x-bzip*", fg = "#e14b39" },
    { mime = "application/x-7z-compressed", fg = "#e14b39" },
    { mime = "application/x-rar",   fg = "#e14b39" },
    { mime = "application/pdf",     fg = "#c76870" },

    # The key is `url`, not `name`: yazi 26 renamed it, and the old spelling
    # fails to parse rather than being ignored.
    { url = "*/", fg = "#498bb2" },              # directories, ice-400
    { url = "*",  fg = "#b1b1b1" },              # everything else, ink-2
]
