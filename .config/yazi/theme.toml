# =====================================================================
#  YAZI -- Voidashi
# =====================================================================
# yazi runs inside the terminal, so it already inherits the emulator's ANSI
# table and background. What it needs from us is its own chrome, and that now
# lives in flavors/voidashi.yazi/flavor.toml, which the generator writes from
# scripts/theme/palette.json. Edit the palette and rerun the generator; do not
# paste a colour here.
#
# What is left in this file is what a flavor should not own: the border glyph,
# the status separators and the button labels. A flavor is loaded first and this
# file overrides it key by key, so the two do not fight.
#
# Key names are yazi's, and yazi renames them without warning: the old spelling
# is parsed and dropped, so the colour is written and never painted. Six keys
# here were in that state. Diff any key added to either file against the default
# theme.toml embedded in the binary rather than against yazi's online docs:
#
#   strings -n 4 /usr/bin/yazi | sed -n '/^#:schema.*theme\.json/,/^\[icon\]/p'

# Both, not just dark. yazi picks by what the terminal reports, and a light
# reading with no flavor named falls back to yazi's own colours.
[flavor]
dark  = "voidashi"
light = "voidashi"

[mgr]
border_symbol = "│"

# Empty on purpose. The powerline separators are the shape that makes a status
# bar read as a default one, the same reason the waybar modules do not sit on
# individual pills.
[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

[which]
separator = "  "

[confirm]
btn_labels = [ "  Yes  ", "  (N)o  " ]
