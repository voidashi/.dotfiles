# Session environment, read by systemd --user, so it reaches both compositors.
#
# This exists because Sway has no way to set an environment variable from its own
# config: `man 5 sway` has no `env` directive, and an `exec` line cannot change
# its parent's environment. Hyprland does have one, `hl.env` in
# conf/env_vars.lua, and it also propagates those values into the systemd and
# D-Bus activation environment by itself.
#
# So under Hyprland these values arrive twice, harmlessly, and under Sway this
# file is the only source. THE TWO FILES MUST AGREE. If you change a value here,
# change conf/env_vars.lua as well, the same way the idle schedule has to be
# changed in two places.
#
# One caveat worth knowing: systemd --user reads this at login. If you start a
# compositor from a bare TTY in a session systemd does not manage, nothing here
# applies, and the variables have to come from your shell profile instead.

# Cursor size, matching kcminputrc, which is generated from palette.json.
XCURSOR_SIZE=24
HYPRCURSOR_SIZE=24

# Qt and KDE applications read their palette from kdeglobals, which is generated
# from palette.json. The ones that are not KDE applications, VLC among them, get
# the same palette through KDEPlasmaPlatformTheme6.so, which is what this
# variable actually loads and which ships in plasma-integration. Without that
# package the variable is set and nothing honours it, with no error.
#
# This used to be qt6ct, which is meant for Qt applications that are *not* KDE
# ones: with no ~/.config/qt6ct to read it served its own default light palette
# over the dark kdeglobals behind it, which is why Dolphin came up white.
QT_QPA_PLATFORMTHEME=kde

# ~/.local/bin, where backup-configs.sh install links this repository's scripts/wm/
# helpers. Nothing else puts it on a session's PATH: config.fish prepends it for
# shells, and a compositor started by a greeter reads no shell profile.
#
# This only arrives in a session started through uwsm, which is what makes the
# compositor a systemd user unit and therefore an heir to this file. Under a
# greeter that execs the compositor directly it is read and never handed over,
# the same as everything above it. So do not treat a bare helper name in a config
# as safe because this line exists; see docs/TURNING-POINTS.md.
PATH=${HOME}/.local/bin:${PATH}
