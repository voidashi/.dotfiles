# Voidashi, GTK4 settings.
#
# GTK4 applications built on libadwaita ignore gtk-theme-name, so there is no
# point setting it here; their appearance comes from the named colours in
# gtk.css. The rest of these are honoured by both.
[Settings]
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=breeze-dark
gtk-cursor-theme-name=capitaine-cursors
gtk-cursor-theme-size=24
# Instrument Sans is the GTK/Qt row of RICE-GUIDE.md's typography table; this
# was Noto Sans, which no part of the design system uses. The cursor and icon
# themes were also inconsistent between GTK3 and GTK4 and now match.
gtk-font-name=Instrument Sans 10
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-primary-button-warps-slider=true
gtk-sound-theme-name=ocean
gtk-xft-dpi=122880
