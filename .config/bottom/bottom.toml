# This is a default config file for bottom.  All of the settings are commented
# out by default; if you wish to change them uncomment and modify as you see
# fit.

# This group of options represents a command-line option.  Flags explicitly
# added when running (ie: btm -a) will override this config file if an option
# is also set here.
[flags]
# Whether to hide the average cpu entry.
#hide_avg_cpu = false
# Whether to use dot markers rather than braille.
#dot_marker = false
# The update rate of the application.
#rate = "1s"
# Whether to put the CPU legend to the left.
#cpu_left_legend = false
# Whether to set CPU% on a process to be based on the total CPU or just current usage.
#current_usage = false
# Whether to set CPU% on a process to be based on the total CPU or per-core CPU% (not divided by the number of cpus).
#unnormalized_cpu = false
# Whether to group processes with the same name together by default.
#group_processes = false
# Whether to make process searching case sensitive by default.
#case_sensitive = false
# Whether to make process searching look for matching the entire word by default.
#whole_word = false
# Whether to make process searching use regex by default.
#regex = false
# The temperature unit. One of the following, defaults to "c" for Celsius:
#temperature_type = "c"
##temperature_type = "k"
##temperature_type = "f"
##temperature_type = "kelvin"
##temperature_type = "fahrenheit"
##temperature_type = "celsius"
# The default time interval (in milliseconds).
#default_time_value = "60s"
# The time delta on each zoom in/out action (in milliseconds).
#time_delta = 15000
# Hides the time scale.
#hide_time = false
# Override layout default widget
#default_widget_type = "proc"
#default_widget_count = 1
# Expand selected widget upon starting the app
#expanded = true
# Use basic mode
#basic = false
# Use the old network legend style
#use_old_network_legend = false
# Remove space in tables
#hide_table_gap = false
# Show the battery widgets
#battery = false
# Disable mouse clicks
#disable_click = false
# Show memory values in the processes widget as values by default
#process_memory_as_value = false
# Show tree mode by default in the processes widget.
#tree = false
# Shows an indicator in table widgets tracking where in the list you are.
#show_table_scroll_position = false
# Show processes as their commands by default in the process widget.
#process_command = false
# Displays the network widget with binary prefixes.
#network_use_binary_prefix = false
# Displays the network widget using bytes.
#network_use_bytes = false
# Displays the network widget with a log scale.
#network_use_log = false
# Hides advanced options to stop a process on Unix-like systems.
#disable_advanced_kill = false
# Shows GPU(s) information
#enable_gpu = false
# Shows cache and buffer memory
#enable_cache_memory = false
# How much data is stored at once in terms of time.
#retention = "10m"
# Where to place the legend for the memory widget. One of "none", "top-left", "top", "top-right", "left", "right", "bottom-left", "bottom", "bottom-right".
#memory_legend = "TopRight".
# Where to place the legend for the network widget. One of "none", "top-left", "top", "top-right", "left", "right", "bottom-left", "bottom", "bottom-right".
#network_legend = "TopRight".

# Processes widget configuration
#[processes]
# The columns shown by the process widget. The following columns are supported:
# PID, Name, CPU%, Mem%, R/s, W/s, T.Read, T.Write, User, State, Time, GMem%, GPU%
#columns = ["PID", "Name", "CPU%", "Mem%", "R/s", "W/s", "T.Read", "T.Write", "User", "State", "GMem%", "GPU%"]

# CPU widget configuration
#[cpu]
# One of "all" (default), "average"/"avg"
# default = "average"

# Disk widget configuration
#[disk]
#[name_filter]
#is_list_ignored = true
#list = ["/dev/sda\\d+", "/dev/nvme0n1p2"]
#regex = true
#case_sensitive = false
#whole_word = false

#[mount_filter]
#is_list_ignored = true
#list = ["/mnt/.*", "/boot"]
#regex = true
#case_sensitive = false
#whole_word = false

# Temperature widget configuration
#[temperature]
#[sensor_filter]
#is_list_ignored = true
#list = ["cpu", "wifi"]
#regex = false
#case_sensitive = false
#whole_word = false

# Network widget configuration
#[network]
#[interface_filter]
#is_list_ignored = true
#list = ["virbr0.*"]
#regex = true
#case_sensitive = false
#whole_word = false

# These are all the components that support custom theming.  Note that colour support
# will depend on terminal support.
#
# Voidashi (RICE-GUIDE.md, "System monitors and TUIs"): Ice for normal ranges, Alert
# tones for thresholds, never a rainbow ramp. Per-core/per-source colour lists below
# only draw from Ice/Moss/Bordeaux -- Ash and Bronze are excluded (both are documented
# as incompatible with Ice in the same view).
#
# The whole [styles] tree below is written by scripts/theme/generate_theme.py from
# scripts/theme/palette.json. Edit the palette and rerun the generator: a hand-edit
# here is reported by check_palette.py and discarded on the next run. It is a marked
# block rather than an include because bottom has neither, only --config_location
# pointing at one file, which is why swaylock and wofi carry one too.
#
# The block ends inside [styles.widgets], so any key written between the end marker
# and the next [[row]] below would join that table without a word. Keep this space
# for comments only.
[styles]

#theme = "default"

# >>> VOIDASHI COLORS (GENERATED) >>>
# GENERATED by scripts/theme/generate_theme.py from scripts/theme/palette.json
# Do not hand-edit: edit palette.json and rerun the generator.
# Voidashi color scheme. See docs/design/RICE-GUIDE.md

# Per-core lines and the average across them. The average carries the identity
# colour, which is the one row that is about this machine rather than a source.
[styles.cpu]
all_entry_color = "#498bb2"
avg_entry_color = "#b44955"
cpu_core_colors = ["#498bb2", "#4e9162", "#b44955", "#307399", "#3d784f", "#7f1f2f", "#215b7c", "#23462d"]

# Ice for the memory a program asked for, Moss for the rest, and an alert tone
# on swap, because swapping is a condition rather than a quantity.
[styles.memory]
ram_color   = "#498bb2"
cache_color = "#307399"
swap_color  = "#d89529"
arc_color   = "#215b7c"
gpu_colors  = ["#498bb2", "#4e9162", "#307399", "#3d784f", "#215b7c", "#23462d"]

# Ice in, Moss out, each with its cumulative total one step darker.
[styles.network]
rx_color       = "#498bb2"
tx_color       = "#4e9162"
rx_total_color = "#307399"
tx_total_color = "#3d784f"

# The one place a ramp is genuinely a state, so it is the alert tones and not a
# family.
[styles.battery]
high_battery_color   = "#57a26d"
medium_battery_color = "#d89529"
low_battery_color    = "#e14b39"

[styles.tables]
headers = { color = "#b1b1b1", bold = true }

# The graph's own grid sits at edge-40, the one step above the border, so the
# plot reads against it without competing with the widget frame.
[styles.graphs]
graph_color = "#4f4d4a"
legend_text = { color = "#b1b1b1" }

# Focus is Ice, the same as every other window on this desktop.
[styles.widgets]
border_color          = "#393835"
selected_border_color = "#498bb2"
widget_title  = { color = "#e8e8e8" }
text          = { color = "#b1b1b1" }
selected_text = { color = "#0a0908", bg_color = "#6aa3c7" }
disabled_text = { color = "#6c6c6c" }
# <<< END VOIDASHI COLORS <<<

# Layout - layouts follow a pattern like this:
# [[row]] represents a row in the application.
# [[row.child]] represents either a widget or a column.
# [[row.child.child]] represents a widget.
#
# All widgets must have the type value set to one of ["cpu", "mem", "proc", "net", "temp", "disk", "empty"].
# All layout components have a ratio value - if this is not set, then it defaults to 1.
# The default widget layout:
#[[row]]
#  ratio=30
#  [[row.child]]
#  type="cpu"
#[[row]]
#    ratio=40
#    [[row.child]]
#      ratio=4
#      type="mem"
#    [[row.child]]
#      ratio=3
#      [[row.child.child]]
#        type="temp"
#      [[row.child.child]]
#        type="disk"
#[[row]]
#  ratio=30
#  [[row.child]]
#    type="net"
#  [[row.child]]
#    type="proc"
#    default=true
