# -*- conf -*-

shell=/bin/fish

# Opacity and padding are matched across all four emulators (RICE-GUIDE.md:
# "padding from the spacing scale and matched between emulators"). 8 comes from
# the spacing scale; 0.92 is the one transparency value the class shares.
# (alpha lives in [colors], below.)
pad=8x8

# Mono primary voice (RICE-GUIDE.md); Hack Nerd Font as glyph-coverage fallback.
font=Iosevka Extended:size=12,Hack Nerd Font:size=12
#font=Hack nerd font:size=12


#include=~/.config/foot/kanagawa-dragon.ini  # legacy theme, preserved for rollback
#include=~/.config/foot/flexoki.ini
include=~/.config/foot/voidashi-colors.ini

# The colours themselves come from the generated include above; only alpha is set
# by hand here, since it is a window property rather than a palette value. It has
# to live in a colors section, and [colors] is deprecated -- hence a second
# [colors-dark] block, which foot merges with the included one.
[colors-dark]
alpha=0.92


