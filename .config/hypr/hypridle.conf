# hypridle: what happens when the machine is left alone.
#
# This file is hyprlang, not Lua, and it is the one file in .config/hypr/ that
# is. Only Hyprland itself gained a Lua config in 0.55; hypridle, hyprlock and
# hyprtoolkit all still read hyprlang, so do not port this to the syntax the
# rest of the directory uses.
#
# The locker is swaylock, themed by .config/swaylock/config. hyprlock is not
# installed and not wanted: one lock screen, one theme to keep correct.
#
# The same schedule exists for Sway, as arguments to swayidle in
# .config/sway/config, because swayidle has no config file. Change both or they
# drift.

general {
    # loginctl lock-session is what fires the listener below, so the actual
    # locking happens in exactly one place no matter what asked for it: this
    # file, the wlogout button, or systemd before a suspend.
    lock_cmd = pidof swaylock || swaylock -f
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 minutes: lock. Short enough to matter, long enough not to interrupt reading.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 minutes: screen off, one minute after the lock. Locking and blanking at the
# same moment means never seeing that it locked.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 minutes: suspend.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
