# =====================================================================
#  HYPRTOOLKIT: Voidashi
# =====================================================================
# Theme for every hyprtoolkit application, which on this machine means
# hyprlauncher. Whether hyprlauncher is the launcher in use is decided in
# conf/programs.lua and nowhere else. This file only describes how it looks
# when it runs, so it stays correct either way, and it is kept themed so
# that switching is a change in one file rather than two.
#
# hyprlauncher has no colours of its own: its config (general:grab_focus,
# ui:window_size, finders:*) covers behaviour only. Appearance comes from
# the toolkit, which reads this file. Keys are top-level, not sectioned.
#
# Roles follow docs/design/RICE-GUIDE.md, "Launchers and menus": a void-20
# surface, the input field one step lighter, the selected entry in Ice, and
# Bordeaux as the identity mark rather than a second selection colour. Which
# role each key takes is decided in scripts/theme/generate_theme.py; the six
# values themselves are generated, because pasting them here made this file a
# second copy of the palette.
#
# The path is absolute because hyprlang resolves a relative source against the
# *process* cwd, not against this file, and says nothing when the glob then
# finds no match. Measured: with "./voidashi-toolkit-colors.conf" and the
# launcher started from anywhere but this directory, the surface renders the
# toolkit's own default and stderr is empty. Same failure as wofi's @import;
# see docs/MAINTENANCE.md.
source = ~/.config/hypr/voidashi-toolkit-colors.conf

# Radius follows whether a surface floats, and a launcher floats. The guide
# names it in the list, so both keys take the floating value, 4. There is no
# scale to place them on: docs/design/RICE-GUIDE.md has two values, 4 and 0, and
# 0 is for a surface docked to a screen edge, which the bar is and this is not.
#
# These two are hand-written rather than generated, because neither is colour.
# They are the literal of palette.json's geometry.radius_floating, so if that
# value ever moves, this file does not follow it on its own.
#
# The comment that used to sit here claimed the opposite, that sharp corners
# apply to every surface that is not a compositor window. That was never the
# rule and it contradicted the guide, which wins for desktop work.
rounding_large = 4
rounding_small = 4

# GTK/Qt-style application chrome takes Instrument Sans, per the guide's
# typography table; mono stays Iosevka Extended, matching every terminal.
font_family = Instrument Sans
font_family_monospace = Iosevka Extended
