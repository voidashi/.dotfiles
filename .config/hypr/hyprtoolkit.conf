# =====================================================================
#  HYPRTOOLKIT -- Voidashi
# =====================================================================
# Theme for every hyprtoolkit application, which on this machine means
# hyprlauncher. Whether hyprlauncher is the launcher in use is decided in
# conf/programs.lua and nowhere else. This file only describes how it looks
# when it runs, so it stays correct either way, and it is kept themed so
# that switching is a change in one file rather than two.
#
# hyprlauncher has no colours of its own: its config (general:grab_focus,
# ui:window_size, finders:*) covers behaviour only. Appearance comes from
# the toolkit, which reads this file. Keys are top-level, not sectioned.
#
# Roles follow docs/design/RICE-GUIDE.md, "Launchers and menus": a void-20
# surface, the input field one step lighter, the selected entry in Ice, and
# Bordeaux as the identity mark rather than a second selection colour.

# Surface: the list itself.
background = rgb(191817)
# One step lighter -- the input field and any alternating row.
alternate_base = rgb(201f1d)

# Text at full contrast; ink-0.
bright_text = rgb(e8e8e8)
# Links pick the lighter Ice so they stay legible on void-20; ice-300.
link_text = rgb(6aa3c7)

# Selection/focus is Ice, everywhere in this desktop; ice-400.
accent = rgb(498bb2)
# Bordeaux is the identity mark, not a focus colour; bordeaux-400.
accent_secondary = rgb(b44955)

# Sharp corners are a Voidashi non-negotiable on every surface that is not a
# compositor window. A launcher is not one.
rounding_large = 0
rounding_small = 0

# GTK/Qt-style application chrome takes Instrument Sans, per the guide's
# typography table; mono stays Iosevka Extended, matching every terminal.
font_family = Instrument Sans
font_family_monospace = Iosevka Extended
