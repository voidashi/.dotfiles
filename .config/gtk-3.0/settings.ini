# Voidashi, GTK3 settings.
#
# nwg-look rewrites this file when used, so treat it as shared ownership: check
# `git diff` here after changing a theme through it. It does not touch gtk.css,
# where the palette lives.
#
# adw-gtk3-dark is the libadwaita widget structure ported to GTK3, so GTK3 and
# GTK4 applications end up the same shape as well as the same colour. Colours
# still come from gtk.css, which is imported after the theme.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=breeze-dark
gtk-cursor-theme-name=capitaine-cursors
gtk-cursor-theme-size=24
# Instrument Sans is the GTK/Qt row of RICE-GUIDE.md's typography table; this
# was Noto Sans, which no part of the design system uses.
gtk-font-name=Instrument Sans 10
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-primary-button-warps-slider=true
gtk-sound-theme-name=ocean
gtk-xft-dpi=122880
gtk-button-images=true
gtk-menu-images=true
gtk-toolbar-style=3
