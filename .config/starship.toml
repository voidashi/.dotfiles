# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Voidashi (RICE-GUIDE.md "Shell and prompt"): ink for the path, moss/alert tones
# for VCS and exit status. Everything else stays at starship's defaults -- restraint
# applies to text as much as to pixels.
# The prompt mark is a chevron, not starship's default arrow: ➜ is rounded and
# decorative where the rest of the desktop is cut and square. Success and error
# stay distinguishable by glyph, not colour alone.
[character]
success_symbol = '[❯](#57a26d) '  # alert-good
error_symbol = '[✗](#e14b39) '    # alert-critical

[directory]
style = '#b1b1b1'  # ink-2

# git_branch/git_status keep starship's default symbols deliberately: the guide's
# "keep it short" applies to glyphs too, and the branch icon already reads at a
# glance. Adding more marks here is the failure mode, not the fix.
[git_branch]
style = '#4e9162'  # moss-400

[git_status]
style = '#d89529'  # alert-caution

# Disable the package module, hiding it from the prompt completely
#[package]
#disabled = true
