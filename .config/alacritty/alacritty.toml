[general]
import = [
    # "~/.config/alacritty/conf.d/kanagawa-dragon.toml",  # legacy theme, preserved for rollback
    "~/.config/alacritty/conf.d/voidashi-colors.toml",
]

[terminal.shell]
program = "/bin/fish"

[window]
opacity = 0.9

[terminal]

# Mono primary voice (RICE-GUIDE.md); glyph fallback is automatic via fontconfig.
[font]
