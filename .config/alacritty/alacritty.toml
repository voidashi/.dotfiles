[general]
import = [
    # "~/.config/alacritty/conf.d/kanagawa-dragon.toml",  # legacy theme, preserved for rollback
    "~/.config/alacritty/conf.d/voidashi-colors.toml",
]

[terminal.shell]
program = "/bin/fish"

# Opacity and padding are matched across all four emulators (RICE-GUIDE.md:
# "padding from the spacing scale and matched between emulators"). 8 comes from
# the spacing scale; 0.92 is the one transparency value the class shares.
[window]
opacity = 0.92
padding = { x = 8, y = 8 }

[terminal]

# Mono primary voice (RICE-GUIDE.md); glyph fallback is automatic via fontconfig.
[font]
normal = { family = "Iosevka Extended" }
size = 12
# Matches every other terminal in the repo.
