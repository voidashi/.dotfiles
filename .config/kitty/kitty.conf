# include kanagawa_dragon.conf  -- legacy theme, preserved for rollback
include voidashi-colors.conf

# Mono primary voice (RICE-GUIDE.md). Kitty auto-falls back to Hack Nerd Font
# for glyphs Iosevka Extended doesn't cover.
font_family Iosevka Extended
# Matches every other terminal in the repo (RICE-GUIDE.md: "different sizes in
# different emulators is the same failure as different ANSI").
font_size 12.0

background_opacity 0.9