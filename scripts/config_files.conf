# ===== config_files.conf =====
# Purpose: Define files/directories to back up and sync across systems
# Format: Paths relative to home directory (~/)
# ---------------------------------------------------------------------

# ===== Core Shell Configurations =====
~/.bashrc
~/.config/starship.toml

# ===== Terminal Emulators =====
~/.config/alacritty
~/.config/kitty
~/.config/foot
~/.config/ghostty

# ===== Window Manager Configs =====
~/.config/hypr
~/.config/sway
~/.config/waybar

# ===== System Utilities =====
~/.config/bottom
~/.config/catnap
~/.config/dunst
~/.config/wofi
~/.config/fastfetch
~/.config/wlogout
~/.config/swaylock
~/.config/swaync

# ===== Voidashi theme =====
~/.config/theme

# GTK application theming. Individual files rather than the whole directories:
# those also hold colors.css, window_decorations.css and assets/, all written by
# kde-gtk-config, and those stay local and untracked on purpose.
~/.config/gtk-3.0/gtk.css
~/.config/gtk-3.0/settings.ini
~/.config/gtk-3.0/voidashi.css
~/.config/gtk-4.0/gtk.css
~/.config/gtk-4.0/settings.ini
~/.config/gtk-4.0/voidashi.css

# Qt/KDE application theming. kdeglobals is where KDE applications actually read
# their palette from; the .colors file only makes the scheme selectable in KDE's
# own settings. KDE tools write to kdeglobals too, so check `git diff` after
# changing anything through a KDE settings dialog.
#
# kcminputrc holds the cursor theme and size. KDE's gtkconfig daemon reads them
# from there and writes them into both GTK settings.ini files, so it is the one
# place the cursor has to be set for Qt and GTK to agree.
#
# On a machine that already runs Plasma these two are the entries to leave out:
# `install --except ~/.config/kdeglobals --except ~/.config/kcminputrc`, and then
# apply the Voidashi scheme through KDE itself. docs/SETUP.md has the reasoning.
~/.config/kdeglobals
~/.config/kcminputrc
# Session environment. The only way to set one for Sway, which has no env
# directive of its own; see the file's own header.
~/.config/environment.d/50-voidashi.conf
~/.local/share/color-schemes/Voidashi.colors

# ===== Development Tools =====
~/.config/nvim
~/.config/fish
~/.config/yazi

# ===== Tracked only if you say so =====
# Commented on purpose rather than forgotten. Secrets are not tracked by default
# in a repository meant to be published, and the desktop entries are per-machine.
# Uncomment to bring one in.
# ~/.ssh/config
# ~/.ssh/known_hosts
# ~/.local/share/applications/
