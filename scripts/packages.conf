# ===== Session =====
# How you get from a boot to a compositor. Both window managers below install their
# own entry into /usr/share/wayland-sessions/, so any display manager will offer
# them; greetd is the one this repo recommends, being Wayland-native, tiny, and
# themeable later through tuigreet's --theme flag.
#
# Installing these two does nothing on its own. greetd needs a root-owned
# /etc/greetd/config.toml and a "systemctl enable greetd.service", neither of which
# backup-configs.sh can manage or check, because both live outside $HOME. See
# docs/SETUP.md for the file and the commands.
#
# Remove both lines if you already run a display manager: enabling a second one
# conflicts with the first over the display-manager.service alias, and a machine
# that already reaches a desktop needs nothing from here.
greetd
greetd-tuigreet

