# Clipboard. wl-clipboard provides wl-copy and wl-paste, the Wayland equivalents
# of the X11 selection tools, and cliphist is the history on top of them: a store
# daemon fed by "wl-paste --watch", and a list that the picker script reads. Both
# compositors start the daemon and bind the picker to the same key. wl-clipboard
# was already installed on this machine but undeclared, which is how a fresh
# clone ends up with a clipboard keybinding that silently does nothing.
wl-clipboard
cliphist
# notify-send, which the clipboard picker uses to say "history is empty" rather
# than opening a menu with nothing in it, since an empty menu reads as a broken
# keybinding. Also installed here already and undeclared.
libnotify
# Idle management, one per compositor, because they have no shared mechanism:
# hypridle reads hypr/hypridle.conf while swayidle takes its whole schedule as
# CLI arguments from the sway config. Both hand off to swaylock, which is already
# themed. Neither was installed before, so the machine never locked or suspended
# on its own; closing the lid was the only thing that locked it.
hypridle
swayidle
# Bound and autostarted but never declared, which is the same defect as
# wl-clipboard above: brightnessctl backs the brightness keys in both compositors
# (hypr/conf/binds.lua and sway/config) and nm-applet is autostarted by
# hypr/conf/autostart.lua. Neither is installed on the machine this was written
# on, so the brightness keys have been doing nothing at all. The applet's package
# name is not its binary name.
brightnessctl
network-manager-applet
# The same defect once more, found while bringing sway's binds onto Hyprland's.
# grim was already called by sway's screenshot bind and was never declared;
# slurp and jq are new, and back the region and window captures that bind now
# has, matching the three hyprshot modes on the Hyprland side. jq is not a
# convenience there: sway has no "capture the focused window" mode, so the bind
# asks swaymsg for the tree and jq reads the geometry out of it.
#
# playerctl backs the media transport keys, which binds.lua has had all along
# and the sway config had not.
#
# wireplumber provides wpctl. Both compositors now drive volume through it;
# sway used to go through pactl, which is the pulse shim over the same server,
# so the two could disagree about which sink is default. binds.lua has called
# wpctl since the beginning, so this was already an undeclared dependency of
# Hyprland's volume keys.
grim
slurp
jq
playerctl
wireplumber
# Not listed, and deliberately: rfkill, pidof, loginctl and systemd-cat are also
# called by the compositors, and they come from util-linux, procps-ng and systemd.
# Those are not installable choices on any distribution this file targets, so
# declaring them would grow the list without changing what a clone gets. The line
# is here because the audit that added the five above asked why they were missing.
# Qt/KDE theming, and the bridge from KDE to GTK.
#
# plasma-integration ships KDEPlasmaPlatformTheme6.so, which is what
# QT_QPA_PLATFORMTHEME=kde (hypr/conf/env_vars.lua) actually loads. Without it
# the variable is set and nothing honours it, with no error. It covers Qt
# applications that are not KDE ones as well, VLC among them, which is why
# qt6ct came out of this list instead of staying as a fallback: it had no
# config to read and served its own light palette over our dark one.
#
# kde-gtk-config writes colors.css in both GTK directories, which our gtk.css
# imports before its own palette, and carries the kded module that copies KDE's
# font, icons and cursor into the GTK settings.ini files. See docs/MAINTENANCE.md.
plasma-integration
kde-gtk-config
xdg-desktop-portal-gtk
xdg-desktop-portal-hyprland
nwg-look
adw-gtk-theme
dolphin
yazi

