# ===== Names that differ per distribution =====
#
# A key repeated in a section below overrides the name handed to that distro's
# installer. A bare key in [common] means the name is the same everywhere.
#
# The override can only rename. There is no way to write "this distro has no such
# package": an empty value falls back to the key, so a missing package is a comment
# here and an install that tries it and fails. Each section therefore lists what it
# has no package for, so the failure is expected rather than discovered.
#
# The names were read out of the distributions' own indexes on 2026-08-03: the Debian
# trixie main binary index, and the Fedora 43 Everything release plus updates
# metadata. Neither branch has ever been run, because the machine this was written on
# is Arch. Correct them on a machine that has the repository, and see docs/TODO.md.

[apt]
greetd-tuigreet = tuigreet
github-cli = gh
pipes.sh = pipes-sh
bottom = btm
swaync = sway-notification-center
libnotify = libnotify-bin
kde-gtk-config = kde-config-gtk-style
firefox = firefox-esr
# No package in Debian trixie main, under this name or any near it:
#   ghostty, catnap, pfetch-rs, supergfxctl, hyprland, hyprlauncher,
#   hyprshot, hyprpicker, hyprpaper, hypridle,
#   xdg-desktop-portal-hyprland, adw-gtk-theme, yazi, code, spotify
# Two of those are not really absences. `code` comes from the Microsoft repository
# that add_repos adds for apt, and `spotify` has never been in Debian. The rest are.
# Hyprland heads the list, so an apt install lands the Sway half of this desktop and
# none of the Hyprland half. That is what the apt branch can do, and it is a
# packaging fact rather than something this section can fix.
# Not checked: contrib and non-free.

[pacman]
# Arch Linux specific names. Empty on purpose: [common] is written in Arch names,
# because that is the distribution this repository is developed and run on.

[dnf]
greetd-tuigreet = tuigreet
github-cli = gh
npm = nodejs-npm
adw-gtk-theme = adw-gtk3-theme
# No package in Fedora 43, release or updates, under this name or any near it:
#   ghostty, starship, catnap, pfetch-rs, pipes.sh, supergfxctl,
#   hyprland, bottom, hyprlauncher, hyprshot, hyprpicker, hyprpaper,
#   swaync, cliphist, hypridle, nwg-look, yazi, code, spotify
# Hyprland heads this list too, with the same consequence as under apt. `code` is a
# real absence here rather than an apparent one: the dnf branch of add_repos adds
# RPM Fusion and not the Microsoft repository.
# Not checked: COPRs, and RPM Fusion itself, which add_repos adds at install time.
