# Clipboard. wl-clipboard provides wl-copy and wl-paste, the Wayland equivalents
# of the X11 selection tools, and cliphist is the history on top of them: a store
# daemon fed by "wl-paste --watch", and a list that the picker script reads. Both
# compositors start the daemon and bind the picker to the same key. wl-clipboard
# was already installed on this machine but undeclared, which is how a fresh
# clone ends up with a clipboard keybinding that silently does nothing.
wl-clipboard
cliphist
# notify-send, which the clipboard picker uses to say "history is empty" rather
# than opening a menu with nothing in it, since an empty menu reads as a broken
# keybinding. Also installed here already and undeclared.
libnotify
# Idle management, one per compositor, because they have no shared mechanism:
# hypridle reads hypr/hypridle.conf while swayidle takes its whole schedule as
# CLI arguments from the sway config. Both hand off to swaylock, which is already
# themed. Neither was installed before, so the machine never locked or suspended
# on its own; closing the lid was the only thing that locked it.
hypridle
swayidle
# Qt/KDE theming, and the bridge from KDE to GTK.
#
# plasma-integration ships KDEPlasmaPlatformTheme6.so, which is what
# QT_QPA_PLATFORMTHEME=kde (hypr/conf/env_vars.lua) actually loads. Without it
# the variable is set and nothing honours it, with no error. It covers Qt
# applications that are not KDE ones as well, VLC among them, which is why
# qt6ct came out of this list instead of staying as a fallback: it had no
# config to read and served its own light palette over our dark one.
#
# kde-gtk-config writes colors.css in both GTK directories, which our gtk.css
# imports before its own palette, and carries the kded module that copies KDE's
# font, icons and cursor into the GTK settings.ini files. See CLAUDE.md.
plasma-integration
kde-gtk-config
xdg-desktop-portal-gtk
xdg-desktop-portal-hyprland
nwg-look
adw-gtk-theme
dolphin
yazi

